
services:
  # ========== MySQL ==========
  mysql:
    image: mysql:8.0
    container_name: vllmpt-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123          # 与 spring.datasource.password 一致
      MYSQL_DATABASE: vllmpt_dev            # 自动创建数据库，与 URL 中的库名一致
      MYSQL_ROOT_HOST: '%'                  # 允许所有 IP 连接（便于宿主机访问）
    ports:
      - "3306:3306"                         # 映射到宿主机 3306，供宿主机上的 Spring 应用连接
    volumes:
      - mysql_data:/var/lib/mysql           # 持久化数据
      - ./mysql/conf:/etc/mysql/conf.d      # 可选：自定义配置目录（如字符集）
    networks:
      - vllmpt-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$MYSQL_ROOT_PASSWORD" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
  # ========== Redis ==========
  redis:
    image: redis:7-alpine
    container_name: vllmpt-redis
    command: redis-server --requirepass redis123 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vllmpt-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== RocketMQ ==========
  # 拓扑：NameServer（路由中心） + Broker（存储/收发） + Dashboard（管理界面）
  # 说明：
  #   * broker.conf 固定 brokerIP1=127.0.0.1（Windows/macOS Docker Desktop 官方方案），
  #     宿主机应用通过端口映射直连 Broker，否则客户端会拿到容器内网 IP 导致连不上
  #   * JAVA_OPT_EXT 必须限制堆内存：镜像默认 8G 会把开发机拖垮
  #   * autoCreateTopicEnable=true 仅为开发便利，生产环境必须关闭
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: vllmpt-rocketmq-namesrv
    command: sh mqnamesrv
    environment:
      - "JAVA_OPT_EXT=-Xms256m -Xmx256m -Xmn128m"
    ports:
      - "9876:9876"
    volumes:
      - rocketmq_namesrv_logs:/home/rocketmq/logs
    networks:
      - vllmpt-network
    restart: unless-stopped

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: vllmpt-rocketmq-broker
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    environment:
      - "NAMESRV_ADDR=rocketmq-namesrv:9876"
      - "JAVA_OPT_EXT=-Xms512m -Xmx512m -Xmn256m"
    ports:
      - "10911:10911"  # Broker 主端口（客户端收发消息）
      - "10909:10909"  # VIP 通道（主从同步/切换）
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf
      - rocketmq_broker_store:/home/rocketmq/store
      - rocketmq_broker_logs:/home/rocketmq/logs
    depends_on:
      - rocketmq-namesrv
    networks:
      - vllmpt-network
    restart: unless-stopped

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:2.1.0
    container_name: vllmpt-rocketmq-dashboard
    environment:
      - "NAMESRV_ADDR=rocketmq-namesrv:9876"
      - "JAVA_OPTS=-Xms256m -Xmx256m -Drocketmq.namesrv.addr=rocketmq-namesrv:9876"
    ports:
      - "8180:8080"  # 宿主 8180 避免与应用默认 8080 冲突
    depends_on:
      - rocketmq-namesrv
      - rocketmq-broker
    networks:
      - vllmpt-network
    restart: unless-stopped

  # ========== Elasticsearch ==========
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: vllmpt-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - vllmpt-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    ulimits:
      memlock:
        soft: -1
        hard: -1

  # ========== Kibana ==========
  kibana:
    image: kibana:8.11.0
    container_name: vllmpt-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - vllmpt-network
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ========== Logstash ==========
  logstash:
    image: logstash:8.11.0
    container_name: vllmpt-logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5044:5044"   # Beats 输入
      - "9600:9600"   # Monitoring API
    networks:
      - vllmpt-network
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ========== MinIO ==========
  minio:
    image: minio/minio:latest
    container_name: vllmpt-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"   # API 端口
      - "9001:9001"   # Console 端口
    volumes:
      - minio_data:/data
    networks:
      - vllmpt-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ========== Chroma  ==========
  chroma:
    image: chromadb/chroma:latest
    container_name: vllmpt-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - vllmpt-network
    restart: unless-stopped
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 5

# ========== 数据卷 ==========
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  rocketmq_namesrv_logs:
    driver: local
  rocketmq_broker_store:
    driver: local
  rocketmq_broker_logs:
    driver: local
  es_data:
    driver: local
  minio_data:
    driver: local
  chroma_data:
    driver: local

# ========== 网络 ==========
networks:
  vllmpt-network:
    driver: bridge