# ==========================================
# RocketMQ Broker 开发环境配置
# 由 docker-compose-env.yml 挂载到：
#   /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
# 修改后需重启 broker 容器生效：docker restart vllmpt-rocketmq-broker
# ==========================================

# 集群与节点标识（单机单 Master）
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# 消息文件清理：凌晨 4 点触发，commitlog 保留 48 小时
deleteWhen = 04
fileReservedTime = 48
# 开发环境：单机无副本，异步刷盘 + 异步复制（性能优先）
# 生产环境应为 SYNC_FLUSH（同步刷盘，刷盘成功才返回 ACK）
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 关键：注册到 NameServer 的 Broker 地址（客户端据此直连 Broker）。
# Windows/macOS Docker Desktop 场景固定为 127.0.0.1（端口已映射到宿主机），
# 若用容器内网 IP 注册，宿主机中的应用将无法连接。
brokerIP1 = 127.0.0.1

# ---- 开发便利项（生产环境必须改为 false 并提前规划 Topic）----
# 发送消息时若 Topic 不存在则自动创建（默认 4 个队列，可开 8 个模拟并发）
autoCreateTopicEnable = true
# 消费组不存在时自动创建
autoCreateSubscriptionGroup = true
defaultTopicQueueNums = 4

# 消费超时时间（分钟）：消息被消费后该时长内未 ACK 视为超时，
# 消费者会被挂起并可触发重平衡
consumeTimeout = 15
