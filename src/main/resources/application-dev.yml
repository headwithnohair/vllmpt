# ==========================================
# 开发环境配置 - development profile
# ==========================================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/vllmpt_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      connection-timeout: 30000
      max-lifetime: 1800000
  
  data:
    redis:
      host: localhost
      port: 6379
      password: redis123
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms
  

# ==========================================
# RocketMQ 配置（替代原 RabbitMQ；NameServer/Broker 见 doc/docker/docker-compose-env.yml）
# 场景6考点映射：
#   发布确认 -> 同步发送判 SendResult.sendStatus / 异步 SendCallback
#   手动 ACK -> 消费返回 ConsumeConcurrentlyStatus（RECONSUME_LATER 触发 broker 重试）
#   死信队列 -> 消费重试耗尽后自动进入 %DLQ%{消费者组}，无需声明 DLX
#   延迟队列 -> 原生延迟消息 MessageDelayLevel（18 级：1s~2h），无需插件
# ==========================================
rocketmq:
  # NameServer 地址：对应 compose 中 rocketmq-namesrv 映射到宿主机的 9876
  name-server: 127.0.0.1:9876
  producer:
    # 生产者组（必配：不配置则 RocketMQTemplate 不会自动装配；事务消息回查也依赖它）
    group: vllmpt-producer
    # 同步发送超时（毫秒）
    send-message-timeout: 3000
    # 同步/异步发送失败重试次数（仅网络类失败；broker 明确拒绝不重试）
    retry-times-when-send-failed: 2
    retry-times-when-send-async-failed: 2

# MinIO 配置
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minio123
  bucket-name: vllmpt-images
  secure: false

# Elasticsearch 配置（场景4 混合检索；绑定 ElasticsearchProperties）
# 注意：compose 中 xpack.security.enabled=false（开发环境关闭鉴权），
# username/password 不会被校验；生产开启 security 后 ElasticsearchConfig 会自动启用 Basic 认证。
elasticsearch:
  hosts: localhost:9200
  username: elastic
  password: elastic123
  connection-timeout: 5s
  socket-timeout: 30s

# 硅基流动 API 配置（开发环境使用测试 Key）
siliconflow:
  api-key: sk-test-your-api-key-here
  base-url: https://api.siliconflow.cn/v1
  timeout: 30s

# LangChain4j 配置
langchain4j:
  open-ai:
    chat-model:
      # 硅基流动 API 地址
      base-url: https://api.siliconflow.cn/v1
      # API Key（优先读环境变量；本地没有配置时使用占位值，保证 Rerank 等 Bean 能启动）
      api-key: ${SILICONFLOW_API_KEY:${siliconflow.api-key}}
      # 默认模型
      model-name: Qwen/Qwen3.6-35B-A3B
      # 超时时间
      timeout: PT30S
      # 温度参数（0-1，越高越创意）
      temperature: 0.7
      # 最大 Token 数
      max-tokens: 8192
      # 顶部采样
      top-p: 0.9
    embedding-model:
      model-name: BAAI/bge-m3
      dimension: 1024
    reranker-model:
      model-name: BAAI/bge-reranker-v2-m3

# 日志配置 - 开发环境详细日志
logging:
  level:
    root: INFO
    org.albedo: DEBUG
    dev.langchain4j: DEBUG
    org.springframework.web: INFO
    com.baomidou.mybatisplus: DEBUG
    org.apache.ibatis: DEBUG
    org.redisson: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/vllmpt-dev.log

# Actuator 监控 - 开发环境开启所有端点
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# Swagger - 开发环境始终开启
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
# 向量数据库配置 (Chroma)
app:
  # 开发期身份：没有登录系统时通过 X-User-Id 请求头指定用户；
  # 未传时回退到默认用户，方便本地联调，生产环境必须关闭。
  identity:
    default-user-enabled: true
    default-user-id: 1
  vector-store:
    base-url: http://localhost:8000
    knowledge-base-collection: vllmpt_knowledge_base
    user-profile-collection: vllmpt_user_profiles
  # 大文件解析入库任务（场景6）：
  # 实时进度存 Redis（RedisKey.fileTaskProgress），台账存 MySQL（ai_file_parse_task）
  file-task:
    # 进度 Hash 的过期时间（秒）：兜底清理，防止异常中断的任务 key 永久残留
    progress-ttl-seconds: 86400
    # 单阶段超时阈值（秒）：超过该时长仍停留在“进行中”的任务，由延迟检查消息判定超时并进入告警/重试
    stage-timeout-seconds: 1800
  # 告警：目前由 DLQ 消费者 / 超时检查触发；未配置 webhook 时只打 ERROR 日志
  alert:
    enabled: true
    # 钉钉/飞书机器人 webhook 地址，留空 = 只打本地日志
    webhook-url: ""
    # webhook 消息格式：DINGTALK / FEISHU
    format: DINGTALK

# 单用户并发推理限制（Redis ZSet）
ai:
  concurrent:
    # 单用户允许的最大并发推理任务数
    limit: 3
    # 活跃窗口（秒）：必须大于最慢一次推理的耗时，否则慢请求被清理会导致超卖
    window-seconds: 300
    # key 兜底过期时间（秒），建议留出窗口的 2 倍余量
    key-ttl-seconds: 600
  # 每日 Token 配额（Redis 预扣 + 结算）
  quota:
    # 每次请求的预扣估算值（固定保守值，不依赖 maxTokens）
    # 边界：若某用户的日额度小于该值，第一次预扣就会失败，该用户无法使用
    estimate-tokens: 2000
    # 用户在 ai_user_token_quota 里没有记录时使用的默认日额度
    default-daily-limit: 10000
    # 日额度缓存的过期时间（秒），配额变更时应主动删掉 ai:quota:limit:{userId}
    cache-ttl-seconds: 600
    # 额度计数器与分模型用量 Hash 的兜底过期时间（秒），默认 2 天
    counter-ttl-seconds: 172800

# Spring Security 配置 - 开发环境关闭安全验证
